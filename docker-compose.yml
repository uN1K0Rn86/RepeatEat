services:
  backend:
    image: ghcr.io/un1k0rn86/repeateat-backend:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - repeateat-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/certs.pem:/etc/letsencrypt/cert.pem:ro
      - ./certs/key.pem:/etc/letsencrypt/key.pem:ro
    depends_on:
      - backend
    networks:
      - repeateat-net

networks:
  repeateat-net:
    driver: bridge
