name: CI pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'worklogs.md'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'worklogs.md'
      - 'README.md'
      - 'LICENSE'

jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: ./repeateat-backend
        run: npm install
      - name: Backend lint
        working-directory: ./repeateat-backend
        run: npm run lint
      - name: Build shared folder for types
        working-directory: ./shared
        run: npm run build
      - name: Initialize DB for tests
        run: docker compose -f docker-compose.citest.yml up postgres-test -d
      - name: Backend tests
        working-directory: ./repeateat-backend
        run: npm run test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          NODE_ENV: 'test'
      - name: Shut down DB container
        run: docker compose -f docker-compose.citest.yml down

      - name: Install frontend dependencies
        working-directory: ./repeateat-frontend
        run: npm install
      - name: Frontend lint
        working-directory: ./repeateat-frontend
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./repeateat-backend/Dockerfile
          tags: repeateat-backend:ci
          load: true
          cache-from: type=gha,scope=repeateat-backend
          cache-to: type=gha,scope=repeateat-backend,mode=max

      - name: Build frontend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./repeateat-frontend/ci.Dockerfile
          tags: repeateat-frontend:ci
          load: true
          cache-from: type=gha,scope=repeateat-frontend
          cache-to: type=gha,scope=repeateat-frontend,mode=max

      - name: Install all workspace deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('repeateat-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: repeateat-frontend
        run: npx playwright install chromium

      - name: Start containerized app
        run: docker compose -f docker-compose.citest.yml up -d --wait

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/login >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not become ready"
          docker compose -f docker-compose.citest.yml logs frontend
          exit 1

      - name: Run Playwright
        working-directory: repeateat-frontend
        run: npm run test:e2e

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.citest.yml down -v
