name: CI pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'worklogs.md'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'worklogs.md'
      - 'README.md'
      - 'LICENSE'

jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: ./repeateat-backend
        run: npm install
      - name: Backend lint
        working-directory: ./repeateat-backend
        run: npm run lint
      - name: Build shared folder for types
        working-directory: ./shared
        run: npm run build
      - name: Initialize DB for tests
        run: docker compose -f docker-compose.citest.yml up postgres-test -d
      - name: Backend tests
        working-directory: ./repeateat-backend
        run: npm run test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          NODE_ENV: 'test'
      - name: Shut down DB container
        run: docker compose -f docker-compose.citest.yml down

      - name: Install frontend dependencies
        working-directory: ./repeateat-frontend
        run: npm install
      - name: Frontend lint
        working-directory: ./repeateat-frontend
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build containerized app
        run: docker compose -f docker-compose.citest.yml up -d
      - name: Install frontend deps
        working-directory: repeateat-frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: repeateat-frontend
        run: npx playwright install --with-deps
      - name: Run Playwright
        working-directory: repeateat-frontend
        run: npx playwright test
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.citest.yml down -v
