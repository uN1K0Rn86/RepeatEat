name: Deploy Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'repeateat-frontend/**'
      - '.gitignore'
      - 'worklogs.md'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/repeateat-backend:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Login in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: repeateat-backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Copy Docker and Nginx files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.BACKEND_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: 'docker-compose.yml,default.conf'
          target: '~/repeateat'

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.BACKEND_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: |
            cd ~/repeateat
            REPO_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/$REPO_LC/repeateat-backend:latest"

            cat <<EOF > .env
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"
            BETTER_AUTH_URL="${{ secrets.BETTER_AUTH_URL }}"
            VITE_API_URL="${{ secrets.VITE_API_URL }}"
            NODE_ENV="production"
            EOF

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE

            docker compose up -d --remove-orphans

            docker compose exec -d nginx nginx -s reload

            docker image prune -f
