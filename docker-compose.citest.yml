services:
  postgres-test:
    image: postgres:18
    container_name: repeateat-pg-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: repeateat_test
    ports:
      - 5435:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./repeateat-backend/Dockerfile
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=test
      - TEST_DATABASE_URL=postgresql://postgres:testpass@postgres-test:5432/repeateat_test
    depends_on:
      postgres-test:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./repeateat-frontend/ci.Dockerfile
    ports:
      - 4173:4173

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.ci.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - frontend
      - backend
